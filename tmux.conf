# 'fix' colors
set -sa terminal-features ",xterm*:RGB"

# Enable mouse mode
set -g mouse on

# Let programs tunnel OSC escapes out to the real terminal (e.g. the mosh
# wrapper recoloring iTerm2's background). Without this tmux swallows them.
set -g allow-passthrough on

# Forward OSC 52 copies (nvim, copy mode, a nested remote tmux) to the outer
# terminal's clipboard. The default `external` silently drops apps' copies.
set -s set-clipboard on
# mosh forwards OSC 52 only as `52;c;`. %p1 is the selection: empty from copy
# mode, the app's own (`c`) from nvim, so always print `c` instead. tmux emits
# nothing unless %p1 is read as a string, hence `%l%Pa` to consume it silently.
set -as terminal-overrides ',xterm*:Ms=\E]52;c%p1%l%Pa;%p2%s\007'

# Report modified keys (ctrl/shift/alt + key) so TUIs can tell them apart
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# add C-a as a prefix key
set-option -g prefix2 C-a

# Vim style pane selection
# bind h select-pane -L
# bind j select-pane -D
# bind k select-pane -U
# bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Don't let programs / shell rename windows after I've named them
set-option -g allow-rename off
set-window-option -g automatic-rename off
# Give every new window a neutral fixed name so unnamed ones don't inherit the
# running command (and don't get restored as "zsh" by tmux-remux).
# Guarded: only rename when the name is still the shell tmux defaulted to, so an
# explicit `new-window -n foo` keeps the name it was given. Don't compare against
# pane_current_command here -- at hook time that's still "tmux", never the shell.
# after-new-window does NOT fire for a session's first window, so the hook is
# duplicated onto after-new-session -- otherwise window 1 of every session keeps
# the shell's name ("zsh") while windows 2+ get "term".
set-hook -g after-new-window "if -F '#{==:#{window_name},#{b:default-shell}}' 'rename-window term'"
set-hook -g after-new-session "if -F '#{==:#{window_name},#{b:default-shell}}' 'rename-window term'"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'

# Session save/restore + prefix+u undo. Pinned: the tag pins the plugin script,
# the version option pins the binary it downloads on first load.
set -g @plugin 'noamsto/tmux-remux#v0.7.3'
set -g @tmux_remux_version 'v0.7.3'
# The plugin runs `restore --auto` on every config source, and restore has no
# once-per-server guard: each `install.sh --sync` would resurrect every session
# killed since the server started. Auto-restore only on the server's first load.
if -F '#{@remux_loaded}' 'set -g @tmux_remux_auto_restore off' 'set -g @remux_loaded 1'

set -g @plugin 'jaclu/tmux-menus'
set -g @menus_trigger 'F12'

# nvim-tree file explorer
set -g @treemux-tree-client 'neo-tree'
set -g @treemux-tree-nvim-init-file '~/.tmux/plugins/treemux/configs/treemux_init.lua'
set -g @plugin 'kiyoon/treemux'

# ── tmux-canopy ───────────────────────────────────────────────────────────
# Session/window/pane tree with agent state in one sidebar; prefix+T toggles it.
# Must stay listed after tmux-remux: remux sets its hooks with no index, which
# clears the whole hook array, so canopy has to re-add its [9xxx] entries last.
set -g @plugin 'jonmosco/tmux-canopy#v0.8.0'
set -g @tmux-canopy-agents 'on'

# canopy needs bash 4.4+, but macOS path_helper puts /bin (bash 3.2) ahead of
# Homebrew and tmux jobs inherit that PATH. Prepend Homebrew for tmux's own jobs.
run-shell '[ "$(command -v bash)" = /bin/bash ] && [ -x /opt/homebrew/bin/bash ] && tmux set-environment -g PATH "/opt/homebrew/bin:$PATH" || true'

run '~/.tmux/plugins/tpm/tpm'

# set vi-mode
set-window-option -g mode-keys vi

# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# `y` is left to tmux-yank, which resolves pbcopy / wl-copy / xclip per platform.
# Don't rebind it to a hardcoded pbcopy -- that breaks every non-macOS install.

# ...except on a headless remote (inside SSH, no X display) where tmux-yank
# resolves `y` to xclip/xsel writing to a $DISPLAY that doesn't exist -- the copy
# dies before it can leave the box. There, rebind `y` (and mouse-drag copy) to
# tmux's own copy, which with `set-clipboard on` emits an OSC 52 escape that this
# tmux + mosh relay to the laptop's clipboard. Must come after `run tpm` so it
# overrides the binding tmux-yank installs at load. Guarded on $SSH_TTY so the
# local machine keeps yank's platform-aware pbcopy/wl-copy path.
if-shell -b '[ -n "$SSH_TTY" ] && [ -z "$DISPLAY" ]' {
  bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
}

# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g default-terminal "tmux-256color"

# ── Palette: gruvbox dark ─────────────────────────────────────────────────
# Names from morhetz/gruvbox colors/gruvbox.vim. Defined once; every style
# below refers to these, so changing theme is editing this block rather than
# hunting 48 hex literals through the status line.

set -g @bg0 "#1d2021"         # dark0_hard -- NOT the default; gruvbox.vim:73 defaults dark to
#          medium (#282828). Hard is chosen so the accent pills sit further out.
set -g @bg1 "#3c3836"         # dark1
set -g @bg2 "#504945"         # dark2
set -g @fg "#ebdbb2"          # light1 -- gruvbox's default dark foreground
set -g @yellow "#fabd2f"      # bright_yellow
set -g @aqua "#8ec07c"        # bright_aqua
set -g @blue "#83a598"        # bright_blue
set -g @orange "#fe8019"      # bright_orange
set -g @purple "#d3869b"      # bright_purple
set -g @yellow_dim "#d79921"  # neutral_yellow -- the bell, kept off bright_yellow so a
#              bell is distinguishable from the active window pill

# ── Status line: Gruvbox (dark, hard background) ──────────────────────────
# Hand-rolled; no theme plugin. Hexes are morhetz/gruvbox dark.
#
# NOTE: nvim runs tokyonight-night (nvim/lua/config/plugins/themes.lua), so the
# bar and the editor no longer share a palette. That mismatch is deliberate for
# now; moving nvim to gruvbox is the other half if the split gets annoying.
#
# Rounded pills use tmux's `reverse` trick: set fg to the BAR background, then
# reverse, and the  /  half-circle is painted in the block's colour
# against the bar. Needs a Nerd Font -- install.sh installs one.
#
# Right-hand modules are deliberately "connected": each one ends on the muted
# block colour and does NOT reset bg, so the next module's  transitions
# straight out of it instead of cutting back to the bar. Adding `bg=default`
# anywhere in status-right breaks that seam.

set -gF status-style "bg=#{@bg0},fg=#{@fg}"

# tmux paints the pane background itself rather than letting the terminal's
# show through. This is what makes the theme tmux's to own: without it the
# window background belongs to the terminal emulator's profile, which is GUI
# state on macOS and cannot live in this repo. Covers every pane, so with a
# transparent-background editor the editor picks it up too.
set -gF window-style "bg=#{@bg0},fg=#{@fg}"
set -gF window-active-style "bg=#{@bg0},fg=#{@fg}"

set -g status-justify left
set -g status-left ""

# Windows: index on an accent block, name on a muted block, capped both ends.
#
# The index colour is set AFTER #[none], never before the cap. #[none] clears
# reverse but keeps the cap's fg, so a colour set ahead of the cap is dead and
# the digits silently inherit the cap colour instead -- on a dark pill that is
# a 2:1 contrast ratio. Setting it after decouples the text from the cap, so
# changing the bar background can no longer recolour the digits.
set -g window-status-format "#[bg=#{@bg2}]#[fg=#{@bg0},reverse]#[none]#[fg=#{@fg}]#I #[fg=#{@fg},bg=#{@bg1}]#W#[fg=#{@bg0},reverse]#[none]"
set -g window-status-current-format "#[bg=#{@yellow}]#[fg=#{@bg0},reverse]#[none]#[fg=#{@bg0}]#I #[fg=#{@fg},bg=#{@bg2}] #W#[fg=#{@bg0},reverse]#[none]"
set -gF window-status-activity-style "bg=#{@purple},fg=#{@bg0}"
set -gF window-status-bell-style "bg=#{@yellow_dim},fg=#{@bg0}"

# Right side: user, directory, clock.
set -g status-right "#[fg=#{@aqua}]#[fg=#{@bg0},bg=#{@aqua}] #[fg=#{@fg},bg=#{@bg1}] #(whoami)#[fg=#{@bg1}] "
set -ag status-right "#[fg=#{@orange}]#[fg=#{@bg0},bg=#{@orange}] #[fg=#{@fg},bg=#{@bg1}] #{b:pane_current_path}#[fg=#{@bg1}] "
set -ag status-right "#[fg=#{@blue}]#[fg=#{@bg0},bg=#{@blue}]󰃰 #[fg=#{@fg},bg=#{@bg1}] %Y-%m-%d %H:%M#[fg=#{@bg1}] "
# tmux-remux expects a periodic save (tmux < 3.8 has no built-in one). The status
# bar re-runs #() every status-interval; save prints nothing and skips if unchanged.
set -ag status-right "#(~/.tmux/plugins/tmux-remux/bin/tmux-remux save --reason=status)"

# tmux defaults status-right-length to 40, which silently clips the composed
# string above (user + directory + clock).
set -g status-right-length 120

# bg is named rather than `default`: `default` means the TERMINAL's default
# background, so with window-style painting the panes the message line was
# the one piece of tmux chrome still showing the emulator's colour through.
set -gF pane-border-style "fg=#{@bg1}"
set -gF pane-active-border-style "fg=#{@yellow}"
set -gF message-style "fg=#{@aqua},bg=#{@bg0},align=centre"
set -gF message-command-style "fg=#{@aqua},bg=#{@bg0},align=centre"
set -gF mode-style "bg=#{@bg2},bold"
set -gF clock-mode-colour "#{@blue}"

bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"

# Nested-tmux passthrough: only bind the F12 OFF-toggle on the LOCAL machine
# (no $SSH_TTY). On a remote server this block is skipped so its own prefix
# stays live and F12 falls through to it instead of toggling both off.
if-shell -b '[ -z "$SSH_TTY" ]' {
  bind -T root F12 \
  set prefix None \;\
  set prefix2 None \;\
  set key-table off \;\
  set status-style "fg=colour245,bg=colour238" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

  bind -T off F12 \
  set -u prefix \;\
  set -u prefix2 \;\
  set -u key-table \;\
  set -u status-style \;\
  refresh-client -S
}
