# 'fix' colors
set -sa terminal-features ",xterm*:RGB"

# Enable mouse mode
set -g mouse on

# Let programs tunnel OSC escapes out to the real terminal (e.g. the mosh
# wrapper recoloring iTerm2's background). Without this tmux swallows them.
set -g allow-passthrough on

# Report modified keys (ctrl/shift/alt + key) so TUIs can tell them apart
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# add C-a as a prefix key
set-option -g prefix2 C-a

# Vim style pane selection
# bind h select-pane -L
# bind j select-pane -D
# bind k select-pane -U
# bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Don't let programs / shell rename windows after I've named them
set-option -g allow-rename off
set-window-option -g automatic-rename off
# Give every new window a neutral fixed name so unnamed ones don't inherit the
# running command (and don't get resurrected as "zsh" by continuum/resurrect).
# Guarded: only rename when the name is still the shell tmux defaulted to, so an
# explicit `new-window -n foo` keeps the name it was given. Don't compare against
# pane_current_command here -- at hook time that's still "tmux", never the shell.
# after-new-window does NOT fire for a session's first window, so the hook is
# duplicated onto after-new-session -- otherwise window 1 of every session keeps
# the shell's name ("zsh") while windows 2+ get "term".
set-hook -g after-new-window "if -F '#{==:#{window_name},#{b:default-shell}}' 'rename-window term'"
set-hook -g after-new-session "if -F '#{==:#{window_name},#{b:default-shell}}' 'rename-window term'"

set -g @continuum-restore 'on'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-pain-control'

set -g @plugin 'jaclu/tmux-menus'
set -g @menus_trigger 'F12'

# nvim-tree file explorer
set -g @treemux-tree-client 'neo-tree'
set -g @treemux-tree-nvim-init-file '~/.tmux/plugins/treemux/configs/treemux_init.lua'
set -g @plugin 'kiyoon/treemux'

# ── tmux-agent-status ─────────────────────────────────────────────────────
# Own fork's main. Follow mode (@agent-sidebar-follow, set below) landed in #6,
# so this no longer needs to track a branch.
set -g @plugin 'jcapona/tmux-agent-status'
# # These MUST be set before tpm runs: the plugin reads them with `show-option` as
# # it loads, so anything set afterwards is silently ignored and you get defaults.
# # All three match the plugin's own defaults; kept explicit so the bindings this
# # config relies on are visible here rather than implied.
# set -g @agent-status-key "S"
# set -g @agent-sidebar-key "O"
# set -g @agent-next-done-key "N"

# # Render every window of an expanded session, including ones with no agent in
# # them (upstream only shows windows that contain a recognised agent process, so
# # e.g. a window running `droid` is invisible). Also orders windows by index
# # instead of by whichever agent was enumerated first. Fork-only option.
# set -g @agent-show-all-windows "on"

# One sidebar per session, not one per window. Per-window is the plugin default
# and it means a renderer process per window; at 40 windows that is the whole
# cost this setup was trying to avoid. prefix+O opens one where it is wanted.
set -g @agent-sidebar-per-window "off"

# One sidebar that moves to whatever window you jump to, rather than one per
# window (a renderer process each) or one stranded in the window it opened in.
set -g @agent-sidebar-follow "on"

# The INBOX section above the session tree. Off is the plugin default now:
# the tree already shows done/ask, and the state gutter makes them easy to
# spot. prefix+N still cycles inbox targets either way.
# set -g @agent-sidebar-inbox "off"

# # Keep the glyph summary off tmux's status line; the sidebar and prefix+S
# # already show agent state. Off is the fork's default, set here so the intent
# # is explicit rather than relying on status-right being rebuilt below.
# set -g @agent-status-line "off"

# set -g @agent-switcher-style "both"        # popup | sidebar | both
# set -g @agent-status-display-method "popup" # popup | window
# set -g @agent-sidebar-width "42"

# # Switcher view (prefix + S). "tree" is the hierarchical
# # session/window/pane list (default). "agents" is a flat list of every
# # agent pane sorted by status. Toggle mid-session with ctrl-f.
# set -g @agent-switcher-default-mode "tree"  # tree | agents

run '~/.tmux/plugins/tpm/tpm'

# set vi-mode
set-window-option -g mode-keys vi

# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# `y` is left to tmux-yank, which resolves pbcopy / wl-copy / xclip per platform.
# Don't rebind it to a hardcoded pbcopy -- that breaks every non-macOS install.

# ...except on a headless remote (inside SSH, no X display) where tmux-yank
# resolves `y` to xclip/xsel writing to a $DISPLAY that doesn't exist -- the copy
# dies before it can leave the box. There, rebind `y` (and mouse-drag copy) to
# tmux's own copy, which with `set-clipboard on` emits an OSC 52 escape that this
# tmux + mosh relay to the laptop's clipboard. Must come after `run tpm` so it
# overrides the binding tmux-yank installs at load. Guarded on $SSH_TTY so the
# local machine keeps yank's platform-aware pbcopy/wl-copy path.
if-shell -b '[ -n "$SSH_TTY" ] && [ -z "$DISPLAY" ]' {
  bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
}

# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g default-terminal "tmux-256color"

# ── Status line: Tokyo Night (night) ──────────────────────────────────────
# Hand-rolled; no theme plugin. Hexes are folke/tokyonight.nvim's `night`
# palette so the bar matches the editor (nvim/lua/config/plugins/themes.lua).
#
# Rounded pills use tmux's `reverse` trick: set fg to the BAR background, then
# reverse, and the  /  half-circle is painted in the block's colour
# against the bar. Needs a Nerd Font -- install.sh installs one.
#
# Right-hand modules are deliberately "connected": each one ends on the muted
# block colour and does NOT reset bg, so the next module's  transitions
# straight out of it instead of cutting back to the bar. Adding `bg=default`
# anywhere in status-right breaks that seam.

set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-justify left
set -g status-left ""

# Windows: index on an accent block, name on a muted block, capped both ends.
set -g window-status-format "#[fg=#16161e,bg=#545c7e]#[fg=#1a1b26,reverse]#[none]#I #[fg=#c0caf5,bg=#292e42]#W#[fg=#1a1b26,reverse]#[none]"
set -g window-status-current-format "#[fg=#16161e,bg=#bb9af7]#[fg=#1a1b26,reverse]#[none]#I #[fg=#c0caf5,bg=#3b4261] #W#[fg=#1a1b26,reverse]#[none]"
set -g window-status-activity-style "bg=#9d7cd8,fg=#16161e"
set -g window-status-bell-style "bg=#e0af68,fg=#16161e"

# Right side: user, directory, clock.
set -g status-right "#[fg=#7dcfff]#[fg=#16161e,bg=#7dcfff] #[fg=#c0caf5,bg=#292e42] #(whoami)#[fg=#292e42] "
set -ag status-right "#[fg=#ff9e64]#[fg=#16161e,bg=#ff9e64] #[fg=#c0caf5,bg=#292e42] #{b:pane_current_path}#[fg=#292e42] "
set -ag status-right "#[fg=#7aa2f7]#[fg=#16161e,bg=#7aa2f7]󰃰 #[fg=#c0caf5,bg=#292e42] %Y-%m-%d %H:%M#[fg=#292e42] "

# tmux defaults status-right-length to 40, which silently clips the composed
# string above (user + directory + clock).
set -g status-right-length 120

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "fg=#73daca,bg=default,align=centre"
set -g message-command-style "fg=#73daca,bg=default,align=centre"
set -g mode-style "bg=#292e42,bold"
set -g clock-mode-colour "#7aa2f7"

bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"

# Nested-tmux passthrough: only bind the F12 OFF-toggle on the LOCAL machine
# (no $SSH_TTY). On a remote server this block is skipped so its own prefix
# stays live and F12 falls through to it instead of toggling both off.
if-shell -b '[ -z "$SSH_TTY" ]' {
  bind -T root F12 \
  set prefix None \;\
  set prefix2 None \;\
  set key-table off \;\
  set status-style "fg=colour245,bg=colour238" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

  bind -T off F12 \
  set -u prefix \;\
  set -u prefix2 \;\
  set -u key-table \;\
  set -u status-style \;\
  refresh-client -S
}
